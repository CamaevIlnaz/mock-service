services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-mock-proxy-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart_mock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_mock}
      POSTGRES_DB: ${POSTGRES_DB:-smart_mock_proxy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-smart_mock} -d ${POSTGRES_DB:-smart_mock_proxy}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
